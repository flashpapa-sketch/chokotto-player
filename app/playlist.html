<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="web-api.js"></script>
<title>プレイリスト</title>
<style>
  /* 本体と同じ青い Winamp 風。こちらは大きさを変えられる。 */
  :root {
    --chassis-a: #4a5a69;
    --chassis-b: #202a34;
    --edge-lo:   #131a21;
    --ink:       #dff0fb;
    --accent:    #21e065;
    --lcd-bg:    #06120c;
    --btn-a:     #55697a;
    --btn-b:     #2c3a47;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden; user-select: none; cursor: default;
    font-family: "MS UI Gothic", "ＭＳ Ｐゴシック", sans-serif;
    background: var(--chassis-b);
  }

  .win {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--chassis-a) 0%, #33414e 22%, var(--chassis-b) 100%);
    border: 1px solid;
    border-color: #6d7f8f var(--edge-lo) var(--edge-lo) #6d7f8f;
  }

  /* ---- タイトルバー ---- */
  .bar {
    -webkit-app-region: drag;
    flex: 0 0 17px;
    display: flex; align-items: center; gap: 4px;
    padding: 0 3px;
    background: linear-gradient(180deg, #4f88ad 0%, #2b5f80 48%, #17405a 100%);
    border-bottom: 1px solid var(--edge-lo);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.30);
    color: var(--ink); font-size: 14px;
    text-shadow: 0 1px 0 rgba(0,0,0,.55);
  }
  .bar .name { flex: 1; font-size: 12.5px; letter-spacing: .1em; }
  .tb {
    -webkit-app-region: no-drag;
    width: 13px; height: 12px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid;
    border-color: #9fd0ea var(--edge-lo) var(--edge-lo) #9fd0ea;
    background: linear-gradient(180deg, #5c94b8, #23566f);
    color: var(--ink); font-size: 12.5px; line-height: 1; cursor: pointer;
  }
  .tb:hover { background: linear-gradient(180deg, #c96060, #8c2a2a); }

  /* ---- 一覧 ---- */
  .list {
    flex: 1;
    margin: 4px 5px 3px;
    background: var(--lcd-bg);
    border: 1px solid;
    border-color: var(--edge-lo) #5f7484 #5f7484 var(--edge-lo);
    box-shadow: inset 0 0 8px rgba(0,0,0,.85);
    overflow-y: auto;
    overflow-x: hidden;
  }
  .list::-webkit-scrollbar { width: 10px; }
  .list::-webkit-scrollbar-track { background: #0a1a12; }
  .list::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #4a7f9c, #21506a);
    border: 1px solid;
    border-color: #7fb6d6 var(--edge-lo) var(--edge-lo) #7fb6d6;
  }

  .row {
    display: flex; align-items: baseline; gap: 6px;
    padding: 1px 5px;
    font-size: 15.5px; line-height: 15px;
    color: var(--accent);
    white-space: nowrap;
    cursor: pointer;
  }
  .row:hover { background: rgba(33,224,101,.10); }
  .row.cur { background: #1d4f7a; color: #ffffff; }
  .row .no { flex: 0 0 auto; opacity: .65; font-family: Consolas, monospace; }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row .kind { flex: 0 0 auto; font-size: 12.5px; opacity: .55; }

  .empty {
    padding: 10px; font-size: 15.5px; color: #17b846; text-align: center;
  }

  /* ---- 下段 ---- */
  .foot {
    flex: 0 0 22px;
    display: flex; align-items: center; gap: 3px;
    padding: 0 5px 3px;
  }
  .btn {
    height: 18px; padding: 0 8px;
    border: 1px solid;
    border-color: #8296a6 var(--edge-lo) var(--edge-lo) #8296a6;
    background: linear-gradient(180deg, var(--btn-a), var(--btn-b));
    color: var(--ink);
    font-family: inherit; font-size: 14px;
    cursor: pointer;
  }
  .btn:hover { background: linear-gradient(180deg, #6a8093, #354655); }
  .btn:active { border-color: var(--edge-lo) #8296a6 #8296a6 var(--edge-lo); }
  .count {
    margin-left: auto;
    font-family: Consolas, monospace; font-size: 14px; color: var(--accent);
  }
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="skin-vars.css">
<link rel="stylesheet" id="skinWindowsCss" href="skin-windows.css">
</head>
<body data-theme="vintage">
<div class="win">

  <div class="bar">
    <span class="name">プレイリスト</span>
    <button class="tb" id="close">×</button>
  </div>

  <div class="list" id="list"></div>

  <div class="foot">
    <button class="btn" id="add">追加</button>
    <button class="btn" id="del">削除</button>
    <button class="btn" id="clear">全消去</button>
    <span class="count" id="count">0 曲</span>
  </div>

</div>

<script>
  const api = window.electronAPI;
  const listEl  = document.getElementById('list');
  const countEl = document.getElementById('count');

  let items = [];      // { name, video }
  let cur = -1;        // 再生中の位置
  let sel = -1;        // 選択中の位置

  function render() {
    listEl.innerHTML = '';
    if (!items.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'ファイルがありません（「追加」で選択）';
      listEl.appendChild(d);
      countEl.textContent = '0 曲';
      return;
    }

    items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (i === cur ? ' cur' : '');
      if (i === sel && i !== cur) row.style.background = 'rgba(33,224,101,.18)';

      const no = document.createElement('span');
      no.className = 'no';
      no.textContent = String(i + 1).padStart(2, '0') + '.';

      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = it.name;
      nm.title = it.name;

      const kind = document.createElement('span');
      kind.className = 'kind';
      kind.textContent = it.video ? '動画' : '';

      row.appendChild(no); row.appendChild(nm); row.appendChild(kind);
      row.addEventListener('click', () => { sel = i; render(); });
      row.addEventListener('dblclick', () => api.plCmd({ type: 'play', index: i }));
      listEl.appendChild(row);
    });

    countEl.textContent = items.length + ' 曲';

    // 再生中の行が見えるようにする
    const el = listEl.children[cur];
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }

  api.onPlState((s) => {
    items = s.items || [];
    cur = typeof s.cur === 'number' ? s.cur : -1;
    if (sel >= items.length) sel = -1;
    render();
  });

  document.getElementById('add').onclick   = () => api.plCmd({ type: 'add' });
  document.getElementById('del').onclick   = () => {
    if (sel >= 0) { api.plCmd({ type: 'remove', index: sel }); sel = -1; }
  };
  document.getElementById('clear').onclick = () => api.plCmd({ type: 'clear' });
  document.getElementById('close').onclick = () => api.close();

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') api.close();
    if (e.key === 'Delete' && sel >= 0) { api.plCmd({ type: 'remove', index: sel }); sel = -1; }
    if (e.key === 'Enter' && sel >= 0) api.plCmd({ type: 'play', index: sel });
  });

  render();
</script>
<script src="skin-apply.js"></script>
</body>
</html>
