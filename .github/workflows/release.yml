name: publish-release
on:
  push:
    branches: [dist-v1.1.1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join files and check SHA-256
        run: |
          mkdir out
          cat parts/setup.part* > out/chokotto-player-1.1.1-setup.exe
          cat parts/portable.part* > out/chokotto-player-1.1.1-portable.zip
          cd out
          echo "eb1ae0328df57519cb5101ac4efe788f08a1991ea7514e541777a0120b5705a4  chokotto-player-1.1.1-setup.exe" > SHA256SUMS.txt
          echo "7c5f313252713be8704edb8e7a063cde673566e1c97801b3225eb0e07f4551b1  chokotto-player-1.1.1-portable.zip" >> SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.1.1 out/chokotto-player-1.1.1-setup.exe out/chokotto-player-1.1.1-portable.zip out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v1.1.1 --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create v1.1.1 out/chokotto-player-1.1.1-setup.exe out/chokotto-player-1.1.1-portable.zip out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target main --title "ちょこっとplayer 1.1.1" --notes-file release-notes.md
          fi
