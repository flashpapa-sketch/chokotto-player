name: build-v1.1.2
on:
  push:
    branches: [release-v1.1.2]
permissions:
  contents: write
env:
  VER: 1.1.2
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Prepare build folder
        shell: bash
        run: |
          mkdir build
          npx --yes @electron/asar@3.2.17 extract app.asar build/app
          cp -r win/resources build/win-res
          cp -r win/root build/win-root
          cp win/icon.ico win/installer.nsh win/builder.json build/
          grep '"version"' build/app/package.json
      - name: Build installer (electron-builder)
        shell: bash
        working-directory: build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm init -y >/dev/null
          npm i -D electron-builder@25.1.8 >/dev/null
          npx electron-builder --win -c builder.json
          ls out
      - name: Make portable zip
        shell: pwsh
        working-directory: build/out
        run: |
          $dir = "ちょこっとplayer $env:VER"
          Copy-Item -Recurse win-unpacked $dir
          & 7z a -tzip -mx=9 "chokotto-player-$env:VER-portable.zip" $dir | Out-Null
          Get-ChildItem *.exe, *.zip | Format-Table Name, Length
      - name: Test the app on Windows
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          cd tests && npm init -y >/dev/null && npm i playwright@1.63.0 >/dev/null && cd ..
          node tests/win-smoke.mjs "$PWD/build/out/win-unpacked/ちょこっとplayer.exe" "$(cygpath -w $PWD/tests/media)" "$(cygpath -w $PWD/tests)"
      - name: Right-click menu was registered by the app
        shell: pwsh
        run: |
          $k = 'HKCU:\Software\Classes\SystemFileAssociations\.mp3\shell\ChokottoPlayer\command'
          (Get-ItemProperty $k).'(default)'
      - name: Install over 1.1.1, then uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $id = 'c0cee8b4-0b13-5e21-ada4-8e9539f14ea8'
          $hives = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$id", "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$id"
          # インストーラーは子プロセスに引き継いで先に終わることがあるので、登録を待つ
          function Wait-Ver($want) {
            for ($i = 0; $i -lt 90; $i++) {
              foreach ($h in $hives) { if (Test-Path $h) { $v = (Get-ItemProperty $h).DisplayVersion; if ($v -eq $want) { return $h } } }
              Start-Sleep 2
            }
            throw "not installed: $want"
          }
          # 先の試験でアプリが登録した右クリックメニューを消し、インストーラー自身が書くかを見る
          Remove-Item -Recurse -Force 'HKCU:\Software\Classes\SystemFileAssociations\.flac\shell\ChokottoPlayer' -ErrorAction SilentlyContinue
          gh release download v1.1.1 --repo $env:GITHUB_REPOSITORY -p '*setup.exe' -D old
          Start-Process -Wait -FilePath (Get-ChildItem old\*.exe).FullName -ArgumentList '/S', '/currentuser'
          $u = Wait-Ver '1.1.1'
          "after 1.1.1: $u"
          Start-Process -Wait -FilePath "build\out\chokotto-player-$env:VER-setup.exe" -ArgumentList '/S', '/currentuser'
          $u = Wait-Ver $env:VER
          Start-Sleep 5
          $p = Get-ItemProperty $u
          # electron-builder は入れた場所を Software\<ID> に書く
          $dir = (Get-ItemProperty "HKCU:\Software\$id" -ErrorAction SilentlyContinue).InstallLocation
          if (-not $dir) { $dir = Join-Path $env:LOCALAPPDATA 'Programs\chokotto-player' }
          "after 1.1.2: " + $p.DisplayVersion + " / " + $dir
          if ($p.DisplayVersion -ne $env:VER) { throw 'version not updated' }
          $exe = Join-Path $dir 'ちょこっとplayer.exe'
          if (-not (Test-Path $exe)) { throw 'exe missing' }
          (Get-Item $exe).VersionInfo.FileVersion
          if (-not (Test-Path (Join-Path $dir 'resources\ckcd.exe'))) { throw 'ckcd.exe missing' }
          $ctx = 'HKCU:\Software\Classes\SystemFileAssociations\.flac\shell\ChokottoPlayer\command'
          "menu: " + (Get-ItemProperty $ctx).'(default)'
          $n = (Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like '*player*' }).Count
          "uninstall entries: $n"
          if ($n -ne 1) { throw 'duplicate install entries' }
          $q = $p.QuietUninstallString
          Start-Process -Wait -FilePath 'cmd.exe' -ArgumentList "/c $q"
          for ($i = 0; $i -lt 60 -and (Test-Path $u); $i++) { Start-Sleep 2 }
          if (Test-Path $u) { throw 'uninstall key left' }
          if (Test-Path $ctx) { throw 'right-click menu left' }
          'uninstall OK'
      - name: Checksums
        shell: bash
        working-directory: build/out
        run: sha256sum chokotto-player-*-setup.exe chokotto-player-*-portable.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win
          path: |
            build/out/chokotto-player-*-setup.exe
            build/out/chokotto-player-*-portable.zip
            tests/win-shot.png
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build .app (universal)
        working-directory: mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx --yes @electron/asar@3.2.17 extract ../app.asar app
          npm init -y >/dev/null
          npm i -D electron-builder@25.1.8 >/dev/null
          npx electron-builder --mac --universal -c builder.json
      - name: Ad-hoc sign and smoke test
        working-directory: mac
        run: |
          APP="$(ls -d out/mac-universal/*.app)"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo signed-ok
          BIN="$(ls "$APP/Contents/MacOS/"* | head -1)"
          "$BIN" > run.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then echo "RUNNING-OK"; else echo "DIED"; cat run.log; exit 1; fi
          kill $PID || true
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist"
      - name: Make dmg
        working-directory: mac
        run: |
          APP="$(ls -d out/mac-universal/*.app)"
          mkdir dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "chokotto-player" -srcfolder dmgroot -ov -format UDZO chokotto-player-$VER-mac.dmg
          shasum -a 256 chokotto-player-$VER-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: mac/chokotto-player-*-mac.dmg
  publish:
    needs: [win, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only when PUBLISH is present
        id: gate
        run: if [ -f PUBLISH ]; then echo go=1 >> $GITHUB_OUTPUT; else echo "PUBLISH が無いので公開しない"; fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.go == '1'
        with: { path: dl }
      - name: Create release v1.1.2
        if: steps.gate.outputs.go == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp dl/win/build/out/chokotto-player-$VER-setup.exe dl/win/build/out/chokotto-player-$VER-portable.zip dl/mac/chokotto-player-$VER-mac.dmg out/
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          gh release create v$VER out/* --repo "$GITHUB_REPOSITORY" --target main --title "ちょこっとplayer $VER" --notes-file release-notes.md --latest
